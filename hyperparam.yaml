# Hyper-params for training imitation learning algorithms
imitation:
all:
    num_steps: 1000000
    eval_interval: 10000
    lr_actor: 3e-4
    lr_critic: 3e-4
    grad_reg_coef : 0.2

  Ant-v2:
    env_id: Ant-v2
    alpha: 0.3
    beta: 0.01
  Hopper-v2:
    env_id: Hopper-v2
    alpha: 0.05
    beta: 0.01
  Humanoid-v2:
    env_id: Humanoid-v2
    alpha: 0.05
    beta: 0.15
  Walker2d-v2:
    env_id: Walker2d-v2
    alpha: 0.7
    beta: 0.01
